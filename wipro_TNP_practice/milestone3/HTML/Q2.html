<!DOCTYPE html>
<html>

<head>
    <title>Ordered and Unordered List</title>
</head>

<body>

    <h2>Ordered List - Favorite Subjects</h2>

    <ol>
        <li>Java</li>
        <li>Python</li>
        <li>HTML</li>
        <li>SQL</li>
        <li>JDBC</li>
    </ol>

    <h2>Unordered List - Favorite Fruits</h2>

    <ul>
        <li>Apple</li>
        <li>Mango</li>
        <li>Banana</li>
        <li>Orange</li>
        <li>Grapes</li>
    </ul>

</body>

</html>
