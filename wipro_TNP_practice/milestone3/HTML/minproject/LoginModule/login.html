<!DOCTYPE html>
<html>

<body>

    <center>

        <h3 style="color: blue;">
            Account Login
        </h3>

        <form>

            <table border="1" cellpadding="5">

                <tr>
                    <td>Username</td>
                    <td>
                        <input type="text"
                               name="username"
                               maxlength="8">
                    </td>
                </tr>

                <tr>
                    <td>Password</td>
                    <td>
                        <input type="password"
                               name="password"
                               maxlength="8">
                    </td>
                </tr>

                <tr>
                    <td colspan="2" align="center">
                        <input type="submit"
                               value="Login">
                    </td>
                </tr>

            </table>

        </form>

    </center>

</body>

</html>
