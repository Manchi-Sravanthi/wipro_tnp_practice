<!DOCTYPE html>
<html>
<head>
    <title>Different Text Colors</title>

    <style>
        h1 {
            color: red;
        }

        h2 {
            color: blue;
        }

        p {
            color: green;
        }

        div {
            color: purple;
        }
    </style>
</head>

<body>

    <h1>Welcome to CSS</h1>

    <h2>This is a heading</h2>

    <p>This is a paragraph.</p>

    <div>This is a div element.</div>

</body>
</html>
